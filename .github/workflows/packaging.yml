name: Packaging

# The riskiest path in the project, because it fails on a *user's* machine and
# not in CI (research R8). Until now the only evidence it worked was one person
# on Windows watching a window appear -- and the last hand-run of it found a real
# bug (GNU tar reading `C:\` as a remote host spec) that reading the code had
# not.
#
# A runner is exactly what T166-T168 ask for: a clean machine with an empty
# runtime cache. Nobody is watching it, so the app reports on itself through
# GRNDCTRL_SMOKE and `scripts/verify-npx.mjs` reads the report.
#
# Not on every push: each job downloads a ~100MB Electron runtime, three times
# over. On main, on pull requests that touch the packaging surface, and on
# demand.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/launcher/**'
      - 'packages/desktop/**'
      - 'scripts/verify-npx.mjs'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pack **once**, on Linux, exactly as `release.yml` does.
  #
  # This job exists because of the v0.1.0 defect. The matrix below used to build
  # its own tarball on each platform and test it there, so every job's native
  # module happened to match the machine it ran on -- and the arrangement that
  # actually ships, one Linux-built tarball installed on Windows, was the one
  # combination never tried. Three green jobs, and `npx grndctrl` was broken on
  # two of the three platforms the moment it was published.
  #
  # Building here and testing that artifact everywhere is the whole point: the
  # thing under test has to be the thing users get.
  pack:
    name: Pack the tarballs (once, on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run native --workspace=@grndctrl/desktop
      - run: npm run build

      # The guard for the specific mistake: nothing platform-specific may be in
      # a tarball that goes to every platform. `files` now lists
      # `native/requirements.json` and not `native/`, and this fails if that ever
      # regresses -- a compiled addon is detectable by its magic bytes, whatever
      # it is named.
      - name: No compiled binary in the universal tarball
        run: |
          mkdir -p dist-tarballs
          npm pack --workspace @grndctrl/desktop --pack-destination dist-tarballs
          tar -tzf dist-tarballs/*.tgz | tee /tmp/listing
          if grep -qE '\.(node|dll|dylib|so)$' /tmp/listing; then
            echo "::error::A compiled binary is inside the published tarball."
            echo "A single npm tarball goes to every platform; a native addon is"
            echo "specific to one. This is exactly how v0.1.0 shipped a Linux"
            echo "binary to Windows and macOS users."
            exit 1
          fi
          echo "No compiled binary in the tarball."
          test -f /tmp/listing

      - name: Pack the rest
        run: |
          for w in @grndctrl/core grndctrl-mcp grndctrl; do
            npm pack --workspace "$w" --pack-destination dist-tarballs
          done
          ls -l dist-tarballs

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs/

  npx:
    name: npx from a tarball (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast here. "It works on Windows and not on Linux" is the most
      # useful result this workflow can produce, and cancelling the other jobs
      # the moment one goes red throws that information away.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The workspace install builds the app. The *verification* deliberately
      # installs from tarballs into a directory with no relationship to this
      # one -- npm hoisting hides a missing dependency until a tarball is
      # unpacked somewhere else, which is how `better-sqlite3` came to be
      # missing from the shipped package while everything passed locally.
      - name: Install workspace
        run: npm ci

      # The artifact from `pack`, built on Linux. `verify-npx.mjs` installs
      # these rather than packing new ones, so what each platform exercises is
      # the byte-identical tarball a user would download.
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: dist-tarballs

      # Electron needs a display and a handful of shared libraries that the
      # ubuntu image does not carry. Without this the app exits before it can
      # report anything, and the failure reads like a packaging bug.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so
      # out of the box *neither* Chromium sandbox is available to an npx install:
      # the setuid helper is not root-owned and the namespace fallback is denied.
      # The launcher refuses to start in that state, on purpose, and prints the
      # two one-line fixes -- so a red job here without this step is the product
      # behaving correctly, not a bug.
      #
      # This applies one of the fixes it prints, which is what a Linux user on
      # 24.04 has to do once. The job then verifies the path they actually get:
      # the namespace sandbox. The refusal branch itself is covered by
      # `packages/launcher/test/sandbox.test.ts`, which can produce all three
      # states -- something no single machine can.
      - name: Allow unprivileged user namespaces (what a 24.04 user must do once)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify npx (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/verify-npx.mjs
        env:
          GRNDCTRL_TARBALLS: ${{ github.workspace }}/dist-tarballs

      - name: Verify npx
        if: runner.os != 'Linux'
        run: node scripts/verify-npx.mjs
        env:
          GRNDCTRL_TARBALLS: ${{ github.workspace }}/dist-tarballs
