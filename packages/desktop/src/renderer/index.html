<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ground Control</title>
    <!--
      The CSP is also set as a response header by main/security.ts. It is
      repeated here so the policy travels with the document: the header is what
      Chromium enforces, and this is what someone opening the file sees. If the
      two ever disagree, the header wins and the disagreement is the bug.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
